name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Datos, motor de cálculo e i18n. Sin dependencias: Node puro.
      - name: Auditoría de datos, motor e i18n
        run: node tests/audit.js

      - name: Validación de HTML
        run: npx -y html-validate index.html

      - name: Servir el sitio
        run: |
          python3 -m http.server 8000 &
          npx -y wait-on http://localhost:8000/index.html

      # Ocho secciones × dos temas.
      #
      # Por sección, porque los paneles se renderizan al seleccionarlos: auditar
      # solo la portada dejaría siete sin cubrir.
      #
      # Por tema, porque cada uno tiene su propio juego de tokens de color.
      #
      # El tema se fija con el parámetro ?tema= de la propia aplicación, no con
      # la preferencia del navegador: --blink-settings=preferredColorScheme no
      # da oscuro de forma fiable, y su valor por defecto cambia según el
      # entorno. Con la bandera, esta auditoría llegó a probar el tema claro dos
      # veces sin cubrir el oscuro.
      #
      # La configuración pasa además --no-sandbox: los runners de GitHub no
      # tienen sandbox de usuario y el Chromium de pa11y no arranca sin ello.
      - name: Accesibilidad (WCAG 2.1 AA)
        run: |
          for theme in light dark; do
            for s in algorithm progress matrix sliders platforms names team extras sources; do
              echo "── $theme / $s"
              npx -y pa11y@8 --config .github/pa11y.json \
                "http://localhost:8000/index.html#/$s?tema=$theme"
            done
          done
